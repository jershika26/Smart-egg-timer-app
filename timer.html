<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="timerContainer">
    <div class="content" id="timerContent">
      <h1>Your Egg is Cooking!</h1>
      <p id="timer">00:00</p>
      <button class="cancel-btn" onclick="cancelTimer()">Cancel</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");

    let timeInSeconds = 0;
    if (type === "soft") timeInSeconds = 5 * 60;       // 5 min
    else if (type === "medium") timeInSeconds = 7 * 60; // 7 min
    else if (type === "hard") timeInSeconds = 10 * 60;  // 10 min

    const timerDisplay = document.getElementById("timer");
    const container = document.getElementById("timerContainer");
    const content = document.getElementById("timerContent");
    let alarmInterval;
    let audioCtx;

    function startTimer() {
      updateDisplay();
      timerInterval = setInterval(() => {
        if (timeInSeconds <= 0) {
          clearInterval(timerInterval);
          showEggReadyMessage();
          return;
        }
        timeInSeconds--;
        updateDisplay();
      }, 1000);
    }

    function updateDisplay() {
      let minutes = Math.floor(timeInSeconds / 60);
      let seconds = timeInSeconds % 60;
      timerDisplay.textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // 🔔 Play Alarm Sound Function (Beep Sequence)
    function playAlarmSound() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep() {
          if (!audioCtx || audioCtx.state === 'closed') return;
          
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Pitch (880Hz / Note A5)
          osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);

          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }

        playBeep();
        alarmInterval = setInterval(playBeep, 600);
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    // 🛑 Stop Alarm Sound Function
    function stopAlarmSound() {
      if (alarmInterval) clearInterval(alarmInterval);
      if (audioCtx && audioCtx.state !== 'closed') {
        audioCtx.close();
      }
    }

    // ✅ FIXED Cancel button function
    function cancelTimer() {
      clearInterval(timerInterval);
      stopAlarmSound();
      timerDisplay.textContent = "00:00";

      // Safely go to home page
      if (window.location.origin === "null" || window.location.origin === "file://") {
        // If opened locally from your computer
        window.location.replace("./index.html");
      } else {
        // If hosted online
        window.location.href = "index.html";
      }
    }

    // ✨ Visual reminder when time finishes
    function showEggReadyMessage() {
      // Play Alarm Sound
      playAlarmSound();

      content.innerHTML = `
        <h1>🥚 Your Egg is Ready! 🥚</h1>
        <p>Time’s up! Enjoy your perfectly cooked egg.</p>
        <div style="margin-top: 20px;">
          <button class="home-btn" onclick="goHome()">Home</button>
          <button class="cancel-btn" onclick="restartTimer()">Restart</button>
        </div>
      `;

      // Flash background color
      let flash = true;
      const flashInterval = setInterval(() => {
        container.style.backgroundColor = flash ? "#FFD700" : "#FFF6C2";
        flash = !flash;
      }, 500);

      setTimeout(() => clearInterval(flashInterval), 10000);
    }

    function goHome() {
      stopAlarmSound();
      window.location.href = "index.html";
    }

    function restartTimer() {
      stopAlarmSound();
      window.location.reload();
    }

    startTimer();
  </script>
</body>
</html>
